<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitDay</title>
    <script type="module" src="../public/js/MainPage.js"></script>

<body class="colorido">
     <!-- MODAL EXCLUIR CONTA -->
    <div id="deleteAccountModal" class="modalOverlay hidden">

        <div class="modalBox">

            <button class="closeModalButton" id="closeDeleteModal">
                ×
            </button>

            <h2>Excluir conta</h2>

            <p>
                Tem certeza que deseja excluir sua conta?
                Essa ação não poderá ser desfeita.
            </p>

            <label for="confirmPassword">
                Digite sua senha para confirmar:
            </label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Sua senha"
            />

            <div class="modalActions">

                <button
                    type="button"
                    class="cancelButton"
                    id="cancelDeleteAccount"
                >
                    Cancelar
                </button>

                <button
                    type="button"
                    class="confirmDeleteButton"
                    id="confirmDeleteAccount"
                >
                    Excluir conta
                </button>

            </div>

        </div>

    </div>
    <header class="headerPage">
        
    </header>
    <main>
        <section id="sectionPage"> 
            <div id="cards" class="cardsConteiner"></div> <!--ONDE OS CARDS DOS DIAS SÃO INSERIDOS-->
        </section>
    </main>
    <script>

    </script>
</body>
